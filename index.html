<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lehrer-Organizer</title>
<meta name="theme-color" content="#1d2a2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Organizer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --surface:#fffdf9; --surface2:#f8f5ef; --line:#e4ded2; --line2:#d6cebf; --ink:#1e2430; --muted:#69707b;
  --accent:#1f6f68; --accent-soft:#e3f0ee; --warn:#b8621f; --warn-soft:#fbeee2; --bad:#b42318; --bad-soft:#fdecea;
  --ok:#2f7d32; --ok-soft:#e8f3e8; --ki:#5b3fb0; --ki-soft:#efe9fb; --r:14px; --shadow:0 1px 2px rgba(30,36,48,.05),0 3px 12px rgba(30,36,48,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Source Sans 3",-apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:650;margin:0;letter-spacing:-.01em}
h1{font-size:27px} h2{font-size:20px} h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav.side{background:#1c2829;color:#e6ece7;padding:18px 12px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow:auto}
nav.side .brand{font-family:Fraunces,serif;font-size:19px;padding:2px 10px 4px;line-height:1.15}
nav.side .who{font-size:13px;opacity:.6;padding:0 10px 14px}
nav.side .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.45;padding:14px 12px 4px;font-weight:700}
nav.side a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:inherit;text-decoration:none;font-weight:500;min-height:44px}
nav.side a:hover{background:rgba(255,255,255,.06)}
nav.side a.on{background:#2e4647;color:#fff}
nav.side .badge{margin-left:auto;background:var(--warn);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px;font-weight:700}
nav.side .badge.ki{background:#7b5fd0}
nav.side .spacer{flex:1}
nav.side .foot{font-size:12px;opacity:.55;padding:8px 12px 0;line-height:1.35}
main{padding:26px 30px 90px;max-width:1220px;width:100%}
.page-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.page-h .grow{flex:1;min-width:200px}
.sub{color:var(--muted);font-size:14.5px;margin-top:2px}
.crumbs{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600} .crumbs a:hover{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:8px 15px;border-radius:11px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn svg.i{width:18px;height:18px}
.btn:hover{border-color:var(--line2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff} .btn.pri:hover{background:#185c56}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:5px 11px;font-size:14.5px;border-radius:9px}
.btn.ki{background:var(--ki-soft);border-color:#dccff7;color:var(--ki)}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,2fr) minmax(270px,1fr);align-items:start}
.split2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.nw{flex-wrap:nowrap}
.stack>*+*{margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 11px;font-size:13.5px;font-weight:600;background:var(--surface2);border:1px solid var(--line);color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;line-height:1.3}
button.chip,a.chip{cursor:pointer}
button.chip:hover{border-color:var(--line2)}
.chip.ok{background:var(--ok-soft);border-color:#cfe5cf;color:var(--ok)}
.chip.warn{background:var(--warn-soft);border-color:#f2d6bd;color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:#f6cfca;color:var(--bad)}
.chip.acc{background:var(--accent-soft);border-color:#c7e0dc;color:var(--accent)}
.chip.kic{background:var(--ki-soft);border-color:#dccff7;color:var(--ki)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.sug{min-height:38px;padding:6px 13px;font-size:14.5px}
.chip.sug.best{background:var(--accent);border-color:var(--accent);color:#fff}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px}
.big-num{font-family:Fraunces,serif;font-size:38px;line-height:1}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line2);border-radius:var(--r)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=time],select,textarea{width:100%;min-height:42px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #9fd0c9;border-color:var(--accent)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.fields .full{grid-column:1/-1}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.sec{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 10px}
/* Heute */
.next{border:none;background:linear-gradient(135deg,#1f6f68,#24524f);color:#fff}
.next .muted,.next .sub,.next .time small{color:rgba(255,255,255,.75)}
.next .chip{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);color:#fff}
.next .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
.next .btn.pri{background:#fff;color:#1f6f68;border-color:#fff}
.lesson-card{display:grid;grid-template-columns:70px 1fr;gap:16px;align-items:start;border-left:5px solid var(--accent)}
.lesson-card .time{font-family:Fraunces,serif;font-size:24px;line-height:1}
.lesson-card .time small{display:block;font-family:"Source Sans 3";font-size:13px;color:var(--muted);margin-top:4px}
.progress{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress>div{height:100%;background:var(--accent)}
/* Kurs */
.unit{border:1px solid var(--line);border-radius:12px;margin-top:12px;background:var(--surface);overflow:hidden}
.unit-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface2);flex-wrap:wrap}
.unit-h h3{flex:1;min-width:150px}
.les{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.les:last-child{border-bottom:0}
.les.cur{background:#eff7f5}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid #c9c2b4;background:#fff;cursor:pointer;display:grid;place-items:center;font-size:14px;color:#fff;padding:0}
.dot.teil{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,#fff 50%)}
.dot.fertig{border-color:var(--ok);background:var(--ok)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;min-height:44px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
/* Material */
.mat{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
.tree{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;padding:10px}
.tree a{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:15px;min-height:38px;cursor:pointer}
.tree a:hover{background:var(--surface2)}
.tree a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tree .n{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600}
.tree .l1{padding-left:28px} .tree .l2{padding-left:48px;font-size:14.5px}
.tree .sw{width:11px;height:11px;border-radius:3px;flex:none}
.tree .sep{height:1px;background:var(--line);margin:8px 4px}
.folder{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-decoration:none;color:var(--ink);min-height:70px}
.folder:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.folder .fi{width:42px;height:34px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none;position:relative}
.folder .t{font-weight:700;line-height:1.2}
.docrow{display:flex;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.docrow:last-child{border-bottom:0}
.docrow:hover{background:var(--surface2)}
.doc-ic{width:38px;height:46px;border-radius:7px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;flex:none;letter-spacing:.02em}
.docrow .t{font-weight:600;line-height:1.25}
.inbox-item{padding:14px;border-bottom:1px solid var(--line)}
.inbox-item:last-child{border-bottom:0}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th,table.t td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:13px;color:var(--muted);font-weight:600}
.wk{display:grid;grid-template-columns:52px repeat(5,minmax(130px,1fr));gap:4px;min-width:720px}
.wk-h{font-size:13px;text-align:center;padding:6px 2px;border-radius:8px;background:var(--surface2)}
.wk-h.tod{background:var(--accent);color:#fff}.wk-h.tod .linkbtn{color:#fff}
.wk-p{font-size:12px;color:var(--muted);text-align:center;display:flex;flex-direction:column;justify-content:center}
.wk-c{display:flex;flex-direction:column;gap:3px;min-height:46px}.wk-c.empty-c{background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(0,0,0,.025) 6px,rgba(0,0,0,.025) 12px);border-radius:8px}
.wk-i{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:1px;padding:5px 7px;border-radius:8px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);font-size:12.5px;line-height:1.25;min-height:46px}
.wk-i b{font-size:12.5px}.wk-i span{color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.wk-i em{font-style:normal;font-size:11px;color:var(--warn)}
.wk-i.done{opacity:.6}.wk-i.aus{opacity:.55;text-decoration:line-through}.wk-i.lk{background:#fff7ed}.wk-i.vt{background:#f3f0ea;border-left-color:#6b5b4b}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;font-size:11.5px}
.wk-h .linkbtn{display:block;margin:2px auto 0;opacity:.75}.wk-h .tiny{margin-top:2px}
.grid3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.slotgrid{display:grid;grid-template-columns:44px repeat(5,1fr);gap:4px}
.slotgrid div{font-size:12px;color:var(--muted);text-align:center;align-self:center}
.slotgrid button{min-height:36px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:13px}
.slotgrid button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.md h1,.md h2,.md h3{margin:14px 0 6px} .md p{margin:6px 0} .md ul,.md ol{margin:6px 0;padding-left:22px}
.md table{border-collapse:collapse;margin:8px 0} .md td,.md th{border:1px solid var(--line);padding:5px 8px}
.md code{background:var(--surface2);padding:1px 5px;border-radius:5px}
.ki-out{background:#faf8ff;border:1px solid #e3dbf7;border-radius:12px;padding:12px 14px;min-height:60px;max-height:52vh;overflow:auto}
.gap{display:grid;grid-template-columns:6px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.gap .bar{border-radius:4px;background:var(--warn)} .gap.bad .bar{background:var(--bad)} .gap.info .bar{background:#a7aeb6}
.scrim{position:fixed;inset:0;background:rgba(20,24,30,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:92vh}
.modal.wide{max-width:940px}
.modal-h{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{flex:1}
.modal-b{padding:18px 20px;overflow:auto}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:13px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1c2829;color:#fff;padding:11px 18px;border-radius:12px;z-index:90;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.hint{background:var(--warn-soft);border:1px solid #f2d6bd;color:#7a3f12;padding:10px 13px;border-radius:11px;font-size:14.5px}
.info{background:var(--accent-soft);border:1px solid #c7e0dc;color:#174f4a;padding:10px 13px;border-radius:11px;font-size:14.5px}
.kibox{background:var(--ki-soft);border:1px solid #dccff7;color:#3b2775;padding:12px 14px;border-radius:12px;font-size:14.5px}
#pres{position:fixed;inset:0;background:#0d0f12;z-index:80;display:flex;flex-direction:column;color:#fff;user-select:none;-webkit-user-select:none}
#pres .stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;touch-action:pan-y}
#pres .stage canvas,#pres .stage img{max-width:100%;max-height:100%;background:#fff}
#pres .slide{background:#fffdf9;color:var(--ink);width:min(96vw,calc((100vh - 70px) * 1.7778));aspect-ratio:16/9;padding:4.5% 6%;overflow:hidden;font-size:clamp(16px,2.4vw,34px);border-radius:4px}
#pres .slide h1{font-size:2em;margin-bottom:.4em} #pres .slide h2{font-size:1.5em;margin-bottom:.4em}
#pres .slide ul,#pres .slide ol{padding-left:1.2em} #pres .slide li{margin:.25em 0}
#pres .bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#15181d;transition:opacity .3s;flex-wrap:wrap}
#pres .bar .btn{background:#252a31;border-color:#353b44;color:#fff;min-height:40px}
#pres .bar .grow{flex:1;text-align:center;font-size:14px;opacity:.8;min-width:100px}
#pres.hidebar .bar{opacity:0}
#pres .black{position:absolute;inset:0;background:#000;display:none;z-index:3}
#pres.blk .black{display:block}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp 1s linear infinite}
.spinner.dark{border-color:rgba(0,0,0,.12);border-top-color:var(--accent);width:22px;height:22px}
@keyframes sp{to{transform:rotate(360deg)}}
.check-list label{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.stchips{display:flex;gap:6px;flex-wrap:wrap}
.stchips button{min-width:46px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.stchips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  nav.side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;align-self:start;overflow-x:auto;padding:8px;z-index:20;gap:2px}
  nav.side .brand,nav.side .who,nav.side .grp,nav.side .foot,nav.side .spacer{display:none}
  nav.side a{flex:none;padding:8px 11px;font-size:14.5px;min-height:40px}
  main{padding:18px 14px 90px}
  .split,.split2,.mat{grid-template-columns:1fr}
  .tree{display:none}
  .lesson-card{grid-template-columns:1fr}
}
@media print{nav.side,.noprint{display:none!important} .app{display:block} main{padding:0}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="nav"></nav>
  <main id="main"><div class="empty">Lade …</div></main>
</div>
<div id="modals"></div>
<script>
"use strict";
/* ================= Grundlagen ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())};
const parseD=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const wd=s=>{const g=parseD(s).getDay();return g===0?7:g};
const today=()=>iso(new Date());
const TAGE=['','Mo','Di','Mi','Do','Fr','Sa','So'];
const fmtD=s=>s?parseD(s).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'}):'';

/* ================= Kalender-Logik ================= */
function isFree(d){ if(wd(d)>5) return true; return (S.settings.ferien||[]).some(f=>f.von&&f.bis&&d>=f.von&&d<=f.bis); }
function ferienName(d){ const f=(S.settings.ferien||[]).find(f=>d>=f.von&&d<=f.bis); return f?f.name:(wd(d)>5?'Wochenende':''); }
const sortedSlots=k=>(k.slots||[]).slice().sort((a,b)=>a.tag-b.tag||a.std-b.std);
let TV=0,_ti=null,_tiRef=null,_tiV=-1;
function termIdx(){ if(_ti&&_tiRef===S.termine&&_tiV===TV) return _ti; const ix={}; Object.values(S.termine||{}).forEach(t=>{ if(t&&t.datum) (ix[t.datum]||(ix[t.datum]=[])).push(t); }); _ti=ix; _tiRef=S.termine; _tiV=TV; return ix; }
const termineAm=d=>termIdx()[d]||[];
function slotsOn(k,d){ if(isFree(d)) return []; const w=wd(d); const T=termineAm(d); if(T.some(t=>t.art==='tagaus')) return [];
  const ab=S.settings.abAktiv?weekType(d):null;
  let sl=(k.slots||[]).filter(s=>s.tag===w&&(!s.woche||!ab||s.woche===ab)).map(s=>s.std);
  sl=sl.filter(std=>!T.some(t=>t.art==='ausfall'&&t.kursId===k.id&&(!t.std||+t.std===std)));
  T.forEach(t=>{ if(t.art==='zusatz'&&t.kursId===k.id&&t.std&&!sl.includes(+t.std)) sl.push(+t.std); });
  return [...new Set(sl)].sort((a,b)=>a-b).map(std=>({date:d,std})); }
function nextSlots(k,from,n){ const out=[]; if(!(k.slots||[]).length) return out; let d=from,g=0; while(out.length<n&&g<420){ out.push(...slotsOn(k,d)); d=addDays(d,1); g++; } return out.slice(0,n); }
function countSlots(k,from,to){ if(!(k.slots||[]).length||!from||from>to) return 0; let n=0,d=from,g=0; while(d<=to&&g<800){ n+=slotsOn(k,d).length; d=addDays(d,1); g++; } return n; }
function flat(k){ const o=[]; (k.einheiten||[]).forEach((e,ei)=>(e.stunden||[]).forEach((s,si)=>o.push({e,s,ei,si}))); return o; }
const dauer=s=>Math.max(1,+s.dauer||1);
function logFor(kid,date,std){ return Object.values(S.logs).find(l=>l.kursId===kid&&l.datum===date&&+l.std===+std); }
function projection(k,from,n){
  const slots=nextSlots(k,from,n+25).filter(s=>!logFor(k.id,s.date,s.std)&&!lkFor(k.id,s.date,s.std)).slice(0,n);
  const open=flat(k).filter(x=>x.s.status!=='fertig'); const res=[]; let li=0,used=0;
  for(const sl of slots){ if(li>=open.length){res.push({...sl,item:null});continue;} const x=open[li]; const need=x.s.status==='teil'?1:dauer(x.s);
    res.push({...sl,item:x,first:used===0,part:used+1,of:need}); used++; if(used>=need){li++;used=0;} }

}
const current=k=>flat(k).find(x=>x.s.status!=='fertig')||null;
function sollIst(k){
  const f=flat(k); const total=f.reduce((a,x)=>a+dauer(x.s),0);
  const ist=f.reduce((a,x)=>a+(x.s.status==='fertig'?dauer(x.s):x.s.status==='teil'?dauer(x.s)/2:0),0);
  if(!k.start||!(k.slots||[]).length) return {total,ist,soll:null,delta:null,left:null};
  const past=countSlots(k,k.start,addDays(today(),-1));
  return {total,ist,soll:Math.min(past,total),delta:ist-Math.min(past,total),left:countSlots(k,today(),S.settings.sjEnde||addDays(today(),300))};
}

function statusChip(k){

function inline(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>'); }
function md(src){
  const lines=String(src||'').replace(/\r/g,'').split('\n'); let out='',list=null,para=[],table=[];
  const fP=()=>{if(para.length){out+='<p>'+para.map(inline).join('<br>')+'</p>';para=[];}};
  const fL=()=>{if(list){out+=`<${list.t}>`+list.items.map(i=>'<li>'+inline(i)+'</li>').join('')+`</${list.t}>`;list=null;}};
  const fT=()=>{if(table.length){const rows=table.filter(r=>!/^\s*\|?\s*:?-{3,}/.test(r));out+='<table>'+rows.map((r,i)=>'<tr>'+r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>i===0?`<th>${inline(c.trim())}</th>`:`<td>${inline(c.trim())}</td>`).join('')+'</tr>').join('')+'</table>';table=[];}};
  const fA=()=>{fP();fL();fT();};
  for(const l of lines){ let m;
    if(/^\s*\|.*\|\s*$/.test(l)){fP();fL();table.push(l);continue;} else fT();
    if(!l.trim()){fA();continue;}
    if((m=l.match(/^(#{1,4})\s+(.*)/))){fA();const n=m[1].length;out+=`<h${n}>${inline(m[2])}</h${n}>`;continue;}
    if((m=l.match(/^\s*[-*•]\s+(.*)/))){fP();if(!list||list.t!=='ul'){fL();list={t:'ul',items:[]};}list.items.push(m[1]);continue;}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){fP();if(!list||list.t!=='ol'){fL();list={t:'ol',items:[]};}list.items.push(m[1]);continue;}
    if(/^\s*(---|___)\s*$/.test(l)){fA();out+='<hr>';continue;}
    fL();para.push(l);
  }
  fA(); return out;
}

/* ===== Upload ===== */
const UPLOADABLE=f=>/^(image|video)\//.test(f.type)||f.type==='application/pdf'||/\.(pdf|txt|md|csv|json)$/i.test(f.name)||/^text\//.test(f.type);
async function pdfInfo(buf){ try{ const lib=await loadPdfLib(); const pdf=await lib.getDocument({data:buf}).promise; let txt=''; for(let i=1;i<=Math.min(2,pdf.numPages);i++){ const tc=await (await pdf.getPage(i)).getTextContent(); txt+=tc.items.map(it=>it.str).join(' ')+' '; } return {pages:pdf.numPages,text:txt.replace(/\s+/g,' ').trim().slice(0,1500)}; }catch(e){ return {pages:0,text:''}; } }
async function handleUpload(files,target,linkToLesson){
  if(!files.length) return;
  const [tf,ts,to]=(target||'||').split('|');
  toast(files.length+' Datei(en) werden verarbeitet …');
  const created=[]; let auto=0, ext=0;
  for(const f of files){
    const base=f.name.replace(/\.[^.]+$/,''); const e=(f.name.split('.').pop()||'').toLowerCase();
    const d={id:uid(),titel:base.replace(/[_]+/g,' '),typ:e==='pdf'?'Arbeitsblatt':/^image|^video/.test(f.type)?'Medien':/pptx|key|odp/.test(e)?'Präsentation':'Sonstiges',fachId:'',stufe:'',ordnerId:'',tags:[],fileName:f.name,mime:f.type,size:f.size,created:Date.now(),seiten:0,snippet:''};
    try{
      if(UPLOADABLE(f)){
        if(e==='pdf'||f.type==='application/pdf'){ const inf=await pdfInfo(await f.arrayBuffer()); d.seiten=inf.pages; d.snippet=inf.text; }
        if(/\.(md|txt)$/i.test(f.name)){ d.kind='md'; d.md=await f.text(); d.snippet=d.md.slice(0,1500); }
        else { d.kind='file'; Object.assign(d,await storeBlob(f,f.name)); }
      } else { d.kind='extern'; ext++; }
    }catch(err){ toast('Upload fehlgeschlagen: '+f.name); continue; }
    const g=guessTyp(f.name); if(g) d.typ=g;
    if(tf){ d.fachId=tf; d.stufe=ts?+ts:''; d.ordnerId=to||''; }
    else if(autoSortDoc(d)) auto++;
    save('docs',d,true); created.push(d);
  }
  render();
  const inb=created.filter(d=>!d.fachId).length;
  if(!tf) toast(`${auto} automatisch einsortiert${inb?`, ${inb} im Eingang mit Vorschlägen`:''}.`);
  else toast(created.length+' Datei(en) in „'+folderLabel(tf,ts,to)+'“ abgelegt.');
  if(ext) setTimeout(()=>toast('Office-Dateien sind nur als Verweis gespeichert – bitte als PDF exportieren.'),1800);
  if(linkToLesson&&ED&&ED.type==='lesson'){ created.forEach(d=>ED.data.docs.push({docId:d.id,rolle:rolleFor(d),seiten:d.seiten||1})); renderLessonDocs(); }
}
const rolleFor=d=>d.typ==='Präsentation'?'praes':d.typ==='Lösung'?'loesung':['Arbeitsblatt','Leistungskontrolle','Lernblatt','Experiment/Protokoll'].includes(d.typ)?'kopie':'lehrer';

  $('#fpok',m).onclick=()=>{ const f=fachById(sel.f); closeModal(); onPick(sel.f,(f.stufen||[]).length?sel.s:'',sel.o); };
  draw();
}

/* ================= PDF ================= */
let pdfLibP=null; const pdfCache={};
function loadPdfLib(){
  if(pdfLibP) return pdfLibP;
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  const load=src=>new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
  pdfLibP=load(base+'pdf.min.js').then(()=>load(base+'pdf.worker.min.js')).then(()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js'; return window.pdfjsLib; });
  pdfLibP.catch(()=>{pdfLibP=null;}); return pdfLibP;
}
function getPdf(d){
  if(!pdfCache[d.id]) pdfCache[d.id]=loadPdfLib().then(async lib=>{ const b=await fileBlob(d); if(!b) throw new Error('nofile'); return lib.getDocument({data:await b.arrayBuffer()}).promise; });
  pdfCache[d.id].catch(()=>{ delete pdfCache[d.id]; }); return pdfCache[d.id];
}
async function renderPdfPage(pdf,no,canvas,maxW,maxH){
  const page=await pdf.getPage(no); const v=page.getViewport({scale:1});
  const sc=Math.min(maxW/v.width,maxH/v.height); const dpr=Math.min(window.devicePixelRatio||1,2.5);
  const vp=page.getViewport({scale:sc*dpr}); canvas.width=vp.width; canvas.height=vp.height; canvas.style.width=(vp.width/dpr)+'px'; canvas.style.height=(vp.height/dpr)+'px';
  await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
}

/* ================= PRÄSENTATION ================= */
let P=null;
const presentable=d=>d&&d.kind!=='extern'&&d.kind!=='link';
function openPresenter(docIds,ctx){
  const items=docIds.map(id=>S.docs[id]).filter(presentable);
  if(!items.length){ toast('Keine präsentierbaren Dokumente (PDF, Bild, Folien) verknüpft.'); return; }
  P={items,i:0,page:1,pages:1,ctx,start:Date.now(),blk:false};
  const el=document.createElement('div'); el.id='pres';
  el.innerHTML=`<div class="stage" id="pstage"></div><div class="bar"><button class="btn sm" data-act="pExit">✕ Beenden</button><button class="btn sm" data-act="pPrev" aria-label="zurück">◀</button><button class="btn sm" data-act="pNext" aria-label="weiter">▶</button>
    <div class="grow" id="pinfo"></div><span id="ptimer" style="font-variant-numeric:tabular-nums;opacity:.8;min-width:48px"></span>
    ${items.length>1?`<select id="psel" style="width:auto;min-height:38px;background:#252a31;color:#fff;border-color:#353b44">${items.map((d,i)=>`<option value="${i}">${esc(d.titel)}</option>`).join('')}</select>`:''}
    <button class="btn sm" data-act="pBlack">◼ Schwarz</button><button class="btn sm" data-act="pFull" aria-label="Vollbild">⛶</button></div>`;
  document.body.appendChild(el);
  const st=$('#pstage'); let sx=null;
  st.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
  st.addEventListener('touchend',e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx; sx=null; if(Math.abs(dx)>50){ dx<0?pNav(1):pNav(-1); } },{passive:true});
  st.addEventListener('click',e=>{ if(e.target.closest('video,a')) return; const x=e.clientX/window.innerWidth; if(x>.7) pNav(1); else if(x<.3) pNav(-1); else el.classList.toggle('hidebar'); });
  const sel=$('#psel'); if(sel) sel.onchange=()=>{ P.i=+sel.value; P.page=1; pRender(); };
  P.timer=setInterval(()=>{ const s=Math.floor((Date.now()-P.start)/1000); const t=$('#ptimer'); if(t) t.textContent=Math.floor(s/60)+':'+pad(s%60); },1000);
  document.addEventListener('keydown',pKey); window.addEventListener('resize',pRender); pRender();
}
function pKey(e){ if(!P) return; if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();pNav(1);} else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();pNav(-1);} else if(e.key==='Escape') pExit(); else if(e.key==='b'||e.key==='B') pBlack(); }
const mdSlides=d=>String(d.md||'').split(/\n\s*---\s*\n/).filter(s=>s.trim());
async function pRender(){
  if(!P) return; const d=P.items[P.i]; const st=$('#pstage'); if(!st) return;
  const black='<div class="black"></div>'; const W=st.clientWidth-16,H=st.clientHeight-16; const sel=$('#psel'); if(sel) sel.value=P.i;
  const token=Symbol(); P.token=token;
  if(d.kind==='md'){ const sl=mdSlides(d); P.pages=sl.length||1; st.innerHTML=black+`<div class="slide md">${md(sl[P.page-1]||'')}</div>`; }
  else if(isImg(d)){ P.pages=1; st.innerHTML=black+`<img alt="">`; $('img',st).src=await fileURL(d); }
  else if(isVid(d)){ P.pages=1; st.innerHTML=black+`<video controls style="max-width:100%;max-height:100%"></video>`; $('video',st).src=await fileURL(d); }
  else { st.innerHTML=black+'<div class="spinner"></div>';
    try{ const pdf=await getPdf(d); if(P?.token!==token) return; P.pages=pdf.numPages; P.page=Math.min(P.page,P.pages); const cv=document.createElement('canvas'); await renderPdfPage(pdf,P.page,cv,W,H); if(P?.token!==token) return; st.innerHTML=black; st.appendChild(cv); }
    catch(e){ st.innerHTML=black+`<div style="text-align:center;padding:20px">Dieses Dokument kann hier nicht angezeigt werden.${navigator.onLine?'':'<br>(Der PDF-Anzeiger wird beim ersten Start mit Internet geladen.)'}</div>`; }
  }
  if(!P) return;
  $('#pinfo').textContent=`${d.titel} · ${P.page}/${P.pages}${P.items.length>1?` · Dok. ${P.i+1}/${P.items.length}`:''}`;
  document.getElementById('pres').classList.toggle('blk',P.blk);
}
function pNav(dir){ if(!P) return; P.blk=false;
  if(dir>0){ if(P.page<P.pages) P.page++; else if(P.i<P.items.length-1){P.i++;P.page=1;} else { toast('Ende der Präsentation'); return; } }
  else { if(P.page>1) P.page--; else if(P.i>0){ P.i--; const d=P.items[P.i]; P.page=d.kind==='md'?(mdSlides(d).length||1):isPdf(d)?9999:1; } }
  pRender(); }
function pBlack(){ if(!P) return; P.blk=!P.blk; document.getElementById('pres').classList.toggle('blk',P.blk); }
function pFull(){ const el=document.getElementById('pres'); try{ if(document.fullscreenElement||document.webkitFullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); } else { const f=el.requestFullscreen||el.webkitRequestFullscreen; if(f){ const r=f.call(el); if(r&&r.catch) r.catch(()=>toast('Vollbild nicht verfügbar')); } else toast('Vollbild nicht verfügbar – in der installierten App ist die Ansicht bereits randlos.'); } }catch(e){ toast('Vollbild nicht verfügbar'); } }
function pExit(){
  if(!P) return; const ctx=P.ctx; clearInterval(P.timer); document.removeEventListener('keydown',pKey); window.removeEventListener('resize',pRender);
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  document.getElementById('pres').remove(); P=null;
  if(ctx&&ctx.kursId&&ctx.stundeId) finishDialog(ctx.kursId,ctx.stundeId,ctx.date||today(),ctx.std||guessStd(ctx.kursId));
}
function guessStd(kid){ const k=S.kurse[kid]; const sl=k?slotsOn(k,today()).filter(s=>!logFor(kid,s.date,s.std)):[]; return sl.length?sl[0].std:''; }

/* ================= Stunde abschließen ================= */
function finishDialog(kid,sid,date,std){
  const k=S.kurse[kid]; const x=k&&findLesson(k,sid); if(!x) return;
  const m=openModal('Stunde abschließen',`<div class="stack"><div><div class="small muted">${esc(k.titel)} · ${esc(fmtD(date))}${std?', '+std+'. Std.':''}</div><h3>${esc(x.s.titel)}</h3></div>
    <div class="check-list">
      <label><input type="radio" name="fst" value="fertig" checked> <b>Vollständig geschafft</b></label>
      <label><input type="radio" name="fst" value="teil"> <span><b>Teilweise</b> – nächste Stunde hier weitermachen</span></label>
      <label><input type="radio" name="fst" value="aus"> Stunde ist ausgefallen</label></div>
    <div id="ferr"><label class="f">Erreicht bis …</label><input type="text" id="ferreicht" value="${esc(x.s.erreicht||'')}" placeholder="z. B. Aufgabe 3 auf dem AB, Folie 7"></div>
    <div><label class="f">Notizen zur Stunde</label><textarea id="fnotiz" placeholder="Was lief gut? Was muss wiederholt werden?"></textarea></div>
    <div><label class="f">Hausaufgabe</label><input type="text" id="fha" placeholder="optional" value="${esc(x.s.ha||'')}"></div></div>`,
    `<button class="btn" data-act="closeModal">Abbrechen</button><button class="btn pri" id="fsave">Speichern</button>`);
  const upd=()=>{ $('#ferr',m).style.display=$('input[name=fst]:checked',m).value==='teil'?'':'none'; }; upd();
  m.querySelectorAll('input[name=fst]').forEach(r=>r.onchange=upd);
  $('#fsave',m).onclick=()=>{
    const st=$('input[name=fst]:checked',m).value; const kk=clone(S.kurse[kid]); const y=findLesson(kk,sid);
    if(st==='fertig'){y.s.status='fertig';y.s.erreicht='';} if(st==='teil'){y.s.status='teil';y.s.erreicht=$('#ferreicht',m).value.trim();}
    const log={id:uid(),kursId:kid,stundeId:sid,titel:y.s.titel,datum:date,std:std?+std:'',status:st,erreicht:st==='teil'?y.s.erreicht:'',notiz:$('#fnotiz',m).value.trim(),ha:$('#fha',m).value.trim(),ts:Date.now()};
    if(st!=='aus') save('kurse',kk,true); save('logs',log); closeModal(); toast('Stunde dokumentiert');
  };
}

  draw(); $('#pq',m).oninput=e=>{q=e.target.value;draw();};

function rangeDates(r){ const t=today(); const mon=addDays(t,-(wd(t)-1));
  if(r==='heute') return [t,t]; if(r==='morgen'){ let d=addDays(t,1),g=0; while(isFree(d)&&g<20){d=addDays(d,1);g++;} return [d,d]; }
  if(r==='woche') return [t,addDays(mon,4)]; if(r==='naechste') return [addDays(mon,7),addDays(mon,11)]; return [t,addDays(t,13)]; }
function printJobs(from,to){
  const jobs=[]; const t=today(); if(to<t) return jobs;
  kurseAktiv().forEach(k=>{ const kl=klasseOf(k); const n=kopienFor(kl);
    projection(k,t,80).filter(p=>p.item&&p.first&&p.date>=from&&p.date<=to).forEach(p=>{

}

function findGaps(){
  const g=[]; const t=today(); const soon=addDays(t,14);
  const inb=inbox().length; if(inb) g.push({lvl:'warn',text:`${inb} Dokument(e) im Eingang warten auf einen Ordner.`,act:['openInbox','']});
  Object.values(S.klassen).forEach(kl=>{ if(!(+kl.schueler)) g.push({lvl:'warn',text:`Klasse ${kl.name}: keine Schülerzahl – Kopienzahl unbekannt.`,act:['editKlasse',kl.id]}); });
  kurseAktiv().forEach(k=>{
    if(!(k.slots||[]).length) g.push({lvl:'bad',text:`${k.titel}: keine Unterrichtszeiten – Kurs kann nicht zeitlich geplant werden.`,act:['editKurs',k.id]});
    if(!flat(k).length) g.push({lvl:'warn',text:`${k.titel}: noch keine Stunden geplant.`,act:['goKurs',k.id],ki:{kind:'kurs',kid:k.id}});
    const si=sollIst(k);
    if(si.left!=null&&si.total-si.ist>si.left) g.push({lvl:'bad',text:`${k.titel}: ${Math.ceil(si.total-si.ist-si.left)} geplante Stunden passen nicht mehr ins Schuljahr.`,act:['goKurs',k.id],ki:{kind:'kuerzen',kid:k.id}});
    else if(si.left!=null&&si.total>0&&si.left-(si.total-si.ist)>6) g.push({lvl:'info',text:`${k.titel}: Planung endet ${Math.floor(si.left-(si.total-si.ist))} Stunden vor Schuljahresende.`,act:['goKurs',k.id],ki:{kind:'kurs',kid:k.id}});
    projection(k,t,30).filter(p=>p.item&&p.first&&p.date<=soon).forEach(p=>{ const s=p.item.s; const docs=(s.docs||[]).filter(r=>S.docs[r.docId]);
      if(!docs.length){ const cand=docsIn(k.fachId,k.stufe,undefined,true).filter(d=>norm([d.titel,d.snippet].join(' ')).includes(norm(s.titel).split(' ').filter(w=>w.length>5)[0]||'§§'));
        g.push({lvl:'warn',text:`${k.titel} · ${fmtD(p.date)}: „${s.titel}“ hat noch kein Material.${cand.length?` Im Ordner gibt es ${cand.length} passende Datei(en).`:''}`,act:['editLessonId',k.id+'|'+s.id],ki:{kind:'stunde',kid:k.id,sid:s.id}}); }
      else if(!docs.some(r=>r.rolle==='praes')) g.push({lvl:'info',text:`${k.titel} · ${fmtD(p.date)}: „${s.titel}“ hat keine Präsentation.`,act:['editLessonId',k.id+'|'+s.id],ki:{kind:'praes',kid:k.id,sid:s.id}}); });
    (k.einheiten||[]).forEach(e=>{ if((e.stunden||[]).length>=3&&!(e.stunden||[]).some(s=>(s.docs||[]).some(r=>S.docs[r.docId]?.typ==='Leistungskontrolle'))) g.push({lvl:'info',text:`${k.titel} › ${e.titel}: keine Leistungskontrolle verknüpft.`,act:['goKurs',k.id],ki:{kind:'lk',kid:k.id,eid:e.id}}); });
  });
  return g;
}
function kursKontext(k,full){
  const kl=klasseOf(k); let t=`Kurs: ${k.titel} (${fachName(k.fachId)}, Klassenstufe ${k.stufe||'?'}), Klasse ${kl?kl.name+', '+(+kl.schueler||0)+' Schüler':'?'}.\n`;
  (k.einheiten||[]).forEach((e,i)=>{ t+=`Einheit ${i+1}: ${e.titel}\n`; if(full!==false)(e.stunden||[]).forEach(s=>{ const docs=(s.docs||[]).map(r=>S.docs[r.docId]).filter(Boolean).map(d=>d.titel+' ['+d.typ+']'); t+=`  - ${s.titel} (${s.status||'offen'})${s.ziele?' – Ziel: '+s.ziele:''}${docs.length?' – Material: '+docs.join(', '):''}\n`; }); });
  const od=docsIn(k.fachId,k.stufe,undefined,true); if(od.length) t+=`Im Materialordner vorhanden: ${od.slice(0,40).map(d=>d.titel).join('; ')}\n`;
  return t;
}
function gapPrompt(ki){
  const k=S.kurse[ki.kid]; const base=kiCtx()+'\n\n'; if(!k) return base;
  const x=ki.sid?findLesson(k,ki.sid):null; const ctx=kursKontext(k); const fmt='\n\nAntworte auf Deutsch, knapp und praxisnah, in Markdown.';
  switch(ki.kind){

    case 'praes': return base+ctx+`\nErstelle für die Stunde „${x.s.titel}“ eine kurze Präsentation als Markdown-Folien (6–9 Folien, jede beginnt mit „# Titel“, Folien durch eine Zeile mit nur „---“ getrennt). Wenig Text, große Stichpunkte, Einstiegsimpuls, Sicherung am Ende. Gib NUR die Folien aus.`;

    case 'kuerzen': return base+ctx+`\nDie Planung passt nicht mehr ins Schuljahr. Schlage vor, welche Stunden zusammengelegt, gekürzt oder gestrichen werden können, ohne Kernziele des Rahmenplans zu verlieren.`+fmt;

  }
}

function applyKISort(arr){

    const mk=a=>{ const fid=fachIdByName(a.fach); if(!fid) return null; const f=fachById(fid); const st=(f.stufen||[]).length?(f.stufen.includes(+a.stufe)?+a.stufe:''):''; const ex=st!==''||!(f.stufen||[]).length?ordnerIn(fid,st).find(o=>norm(o.name)===norm(a.thema||'')):null; return {fachId:fid,stufe:st,ordnerId:ex?ex.id:'',ordnerNeu:!ex&&a.thema?String(a.thema).slice(0,40):'',conf:+a.sicher||.5,src:'ki',grund:a.grund||''}; };
    const v=[mk(r),...(r.alternativen||[]).map(a=>mk({...a,sicher:.3}))].filter(Boolean);
    const x=clone(d); if(r.typ&&TYPEN.includes(r.typ)) x.typ=r.typ; x.vorschlaege=[...v,...(d.vorschlaege||[]).filter(a=>a.src!=='ki')].slice(0,4); save('docs',x,true); n++; });

/* ================= Kalender-Export (iCal) ================= */
function icsEscape(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/([,;])/g,'\\$1'); }
function icsFold(l){ const out=[]; let s=l; while(s.length>73){ out.push(s.slice(0,73)); s=' '+s.slice(73); } out.push(s); return out.join('\r\n'); }
function icsDT(d,hm){ return d.replace(/-/g,'')+'T'+String(hm||'00:00').replace(':','')+'00'; }
function buildICS(from,to,opts){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Lehrer-Organizer//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Unterricht'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''); let n=0;
  const ev=(uid,d,std,sum,desc,loc)=>{ const p=(S.settings.periods||[])[std-1]; if(!p||!p[0]) return; L.push('BEGIN:VEVENT','UID:'+uid+'@lehrer-organizer','DTSTAMP:'+stamp,'DTSTART:'+icsDT(d,p[0]),'DTEND:'+icsDT(d,p[1]||p[0]),icsFold('SUMMARY:'+icsEscape(sum))); if(desc) L.push(icsFold('DESCRIPTION:'+icsEscape(desc))); if(loc) L.push(icsFold('LOCATION:'+icsEscape(loc))); L.push('END:VEVENT'); n++; };
  for(let d=from,g=0;d<=to&&g<400;d=addDays(d,1),g++){ if(wd(d)>5) continue;
    dayItems(d).forEach(it=>{ if(it.typ==='ausfall') return;
      if(it.typ==='vertretung'){ if(opts.vertretung) ev('vt-'+it.t.id,d,it.std,'Vertretung '+(it.t.klasse||'')+(it.t.fach?' '+it.t.fach:''),[it.t.titel,it.t.notiz].filter(Boolean).join('\n'),it.t.raum); return; }
      const k=it.k; let sum=k.titel, desc='';
      if(it.lk){ sum+=' – 📝 '+(it.lk.titel||'Leistungskontrolle'); }
      else if(opts.themen&&it.p&&it.p.item){ sum+=' – '+it.p.item.s.titel; desc=[it.p.item.e.titel,it.p.item.s.ziele?'Ziel: '+it.p.item.s.ziele:''].filter(Boolean).join('\n'); }
      ev(k.id+'-'+d+'-'+it.std,d,it.std,sum,desc,''); }); }
  L.push('END:VCALENDAR'); return {text:L.join('\r\n'),n}; }
function openIcsExport(){
  const m=openModal('Stundenplan als Kalender',`<div class="stack"><p class="small">Erzeugt eine Kalenderdatei (.ics) mit deinen Unterrichtsstunden – Ausfälle und Ferien sind schon herausgerechnet. Auf dem iPad: Datei öffnen → „Alle hinzufügen“ → am besten einen eigenen Kalender „Unterricht“ wählen.</p>
    <div class="fields"><div><label class="f">Zeitraum</label><select id="icR">${opt([['4','nächste 4 Wochen'],['ferien','bis zu den nächsten Ferien'],['sj','bis Schuljahresende']],'ferien')}</select></div><div></div>
    <label class="row nw small"><input type="checkbox" id="icT" checked style="width:20px;height:20px"> Geplante Stundenthemen eintragen</label><label class="row nw small"><input type="checkbox" id="icV" checked style="width:20px;height:20px"> Vertretungsstunden</label></div>
    <div class="hint small">Kalender-Apps übernehmen eine Datei als Kopie. Wenn sich die Planung ändert: den Kalender „Unterricht“ löschen und neu exportieren, sonst entstehen doppelte Einträge.</div></div>`,
    `<button class="btn" data-act="closeModal">Abbrechen</button><button class="btn pri" id="icGo">Exportieren</button>`);
  $('#icGo',m).onclick=async()=>{ const r=$('#icR',m).value; const t=today(); let to;
    if(r==='4') to=addDays(t,27); else if(r==='sj') to=S.settings.sjEnde||addDays(t,300); else { const f=(S.settings.ferien||[]).filter(x=>x.von>t&&(+parseD(x.bis)-+parseD(x.von))>=2*864e5).sort((a,b)=>a.von.localeCompare(b.von))[0]; to=f?addDays(f.von,-1):addDays(t,41); }
    const {text,n}=buildICS(t,to,{themen:$('#icT',m).checked,vertretung:$('#icV',m).checked}); if(!n){ toast('Keine Stunden im Zeitraum'); return; }
    const name='unterricht-'+t+'.ics'; const file=new File([text],name,{type:'text/calendar'}); let ok=false;
    if(!ENV.downloads&&navigator.canShare){ try{ if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); ok=true; } }catch(e){ ok=e&&e.name==='AbortError'; } }
    if(!ok) ok=await saveFile(name,text,'text/calendar'); if(ok){ closeModal(); toast(n+' Stunden exportiert'); } };
}

/* ================= Arbeitsblatt als PDF ================= */
let pdfLibWP=null;
function loadPdfLibW(){ if(window.PDFLib) return Promise.resolve(window.PDFLib); if(pdfLibWP) return pdfLibWP; pdfLibWP=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='pdf-lib.min.js'; s.onload=()=>window.PDFLib?res(window.PDFLib):rej(new Error('pdf-lib fehlt')); s.onerror=()=>rej(new Error('PDF-Baustein konnte nicht geladen werden')); document.head.appendChild(s); }); pdfLibWP.catch(()=>{pdfLibWP=null;}); return pdfLibWP; }
const PDF_MAP={'→':'->','←':'<-','⇒':'=>','≈':'~','≤':'<=','≥':'>=','≠':'!=','√':'Wurzel ','∙':'·','⋅':'·','−':'-','‑':'-','✓':'x','☐':'[ ]','□':'[ ]','✔':'x','\u00a0':' ','Δ':'Delta ','π':'pi','α':'alpha','β':'beta','γ':'gamma','λ':'lambda','ρ':'rho','Ω':'Ohm','⁴':'^4','⁵':'^5','⁻':'^-','₁':'1','₂':'2','₃':'3','₀':'0'};
async function mdToPdf(src,opts){
  const PL=await loadPdfLibW(); const doc=await PL.PDFDocument.create(); const F=await doc.embedFont(PL.StandardFonts.Helvetica), FB=await doc.embedFont(PL.StandardFonts.HelveticaBold), FI=await doc.embedFont(PL.StandardFonts.HelveticaOblique);
  const enc=new Map(); const safe=s=>Array.from(String(s)).map(ch=>{ if(PDF_MAP[ch]!=null) return PDF_MAP[ch]; if(!enc.has(ch)){ try{ F.encodeText(ch); enc.set(ch,true); }catch(e){ enc.set(ch,false); } } return enc.get(ch)?ch:'?'; }).join('').replace(/\?{2,}/g,'?');
  const W=595.28,H=841.89,M=56; const C=PL.rgb(0.106,0.263,0.196), G=PL.rgb(0.42,0.46,0.44), K=PL.rgb(0.11,0.14,0.13);
  let page,y; const pages=[];
  const newPage=()=>{ page=doc.addPage([W,H]); pages.push(page); y=H-M; if(opts.kopf&&pages.length===1){ page.drawText(safe(opts.kopf),{x:M,y:H-34,size:9,font:F,color:G}); } };
  const ensure=h=>{ if(y-h<M+20) newPage(); };
  const wrap=(txt,font,size,maxW)=>{ const words=safe(txt).split(/\s+/).filter(Boolean); const lines=[]; let cur=''; for(const w of words){ const tr=cur?cur+' '+w:w; if(font.widthOfTextAtSize(tr,size)<=maxW) cur=tr; else { if(cur) lines.push(cur); cur=w; while(font.widthOfTextAtSize(cur,size)>maxW&&cur.length>4){ let i=cur.length-1; while(i>1&&font.widthOfTextAtSize(cur.slice(0,i),size)>maxW) i--; lines.push(cur.slice(0,i)); cur=cur.slice(i); } } } if(cur) lines.push(cur); return lines.length?lines:['']; };
  const para=(txt,{font=F,size=11.5,indent=0,color=K,gap=4,lh=1.35,prefix=''}={})=>{ const pw=prefix?font.widthOfTextAtSize(safe(prefix),size)+4:0; const lines=wrap(txt,font,size,W-2*M-indent-pw); lines.forEach((l,i)=>{ ensure(size*lh); if(i===0&&prefix) page.drawText(safe(prefix),{x:M+indent,y:y-size,size,font,color}); page.drawText(l,{x:M+indent+pw,y:y-size,size,font,color}); y-=size*lh; }); y-=gap; };
  newPage();
  const lines=String(src||'').replace(/\r/g,'').split('\n'); let first=true, inTable=false;
  for(let raw of lines){ let l=raw.replace(/\s+$/,''); const plain=s=>s.replace(/\*\*(.+?)\*\*/g,'$1').replace(/(^|\W)\*(\S[^*]*?)\*(?=\W|$)/g,'$1$2').replace(/`([^`]+)`/g,'$1').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1');
    if(/^\s*\|/.test(l)){ if(/^\s*\|?\s*:?-{3,}/.test(l)) continue; const cells=l.trim().replace(/^\||\|$/g,'').split('|').map(c=>plain(c.trim())); const cw=(W-2*M)/cells.length; const hs=cells.map(c=>wrap(c,inTable?F:FB,10.5,cw-8)); const h=Math.max(...hs.map(x=>x.length))*14+8; ensure(h);
      cells.forEach((c,i)=>{ page.drawRectangle({x:M+i*cw,y:y-h,width:cw,height:h,borderColor:G,borderWidth:0.6,color:inTable?undefined:PL.rgb(0.95,0.97,0.96)}); hs[i].forEach((t,j)=>page.drawText(t,{x:M+i*cw+4,y:y-14-j*14,size:10.5,font:inTable?F:FB,color:K})); }); y-=h; inTable=true; continue; }
    if(inTable){ inTable=false; y-=8; }
    if(!l.trim()){ y-=5; continue; }
    if(/^\s*(---|___|\*\*\*)\s*$/.test(l)){ ensure(14); page.drawLine({start:{x:M,y:y-6},end:{x:W-M,y:y-6},thickness:0.6,color:G}); y-=14; continue; }
    let mm;
    if((mm=l.match(/^#\s+(.+)/))){ const t=plain(mm[1]); if(/^l(ö|oe)sung/i.test(t)&&opts.loesungNeueSeite&&!first) newPage(); para(t,{font:FB,size:first?19:17,color:C,gap:first&&opts.nameZeile?6:8}); if(first&&opts.nameZeile){ para('Name: ____________________________   Klasse: ________   Datum: ____________',{size:10.5,color:G,gap:10}); } first=false; continue; }
    if((mm=l.match(/^##\s+(.+)/))){ ensure(30); y-=4; para(plain(mm[1]),{font:FB,size:13.5,color:C,gap:5}); first=false; continue; }
    if((mm=l.match(/^#{3,}\s+(.+)/))){ para(plain(mm[1]),{font:FB,size:12,gap:4}); continue; }
    if((mm=l.match(/^(\s*)[-*•]\s+(.+)/))){ para(plain(mm[2]),{indent:12+Math.min(2,Math.floor(mm[1].length/2))*14,prefix:'•',gap:2}); continue; }
    if((mm=l.match(/^(\s*)(\d+|[a-z])[.)]\s+(.+)/))){ para(plain(mm[3]),{indent:6+Math.min(2,Math.floor(mm[1].length/2))*14,prefix:mm[2]+')',gap:2}); continue; }
    if((mm=l.match(/^>\s?(.+)/))){ para(plain(mm[1]),{font:FI,indent:12,color:G}); continue; }
    if(/^_{4,}$/.test(l.trim())||/^\.{6,}$/.test(l.trim())){ for(let i=0;i<3;i++){ ensure(22); page.drawLine({start:{x:M,y:y-16},end:{x:W-M,y:y-16},thickness:0.5,color:G}); y-=22; } continue; }
    const whole=/^\*\*[^*]+\*\*:?$/.test(l.trim()); para(plain(l),{font:whole?FB:F}); first=false;
  }
  pages.forEach((p,i)=>{ if(opts.fuss) p.drawText(safe(opts.fuss),{x:M,y:28,size:8.5,font:F,color:G}); p.drawText(String(i+1)+'/'+pages.length,{x:W-M-24,y:28,size:8.5,font:F,color:G}); });
  return {bytes:await doc.save(),pages:pages.length}; }

function diffPrompt(d,niveau){ const f=fachById(d.fachId); const text=d.kind==='md'?d.md:(d.snippet||'');

    if(!E.length){ $('#svOut',m).innerHTML='<div class="hint">Kein Plan erkannt.</div>'; return; } const sum=E.reduce((a,e)=>a+e.stunden.reduce((b,s)=>b+s.dauer,0),0);

    show(neu.map(x=>{ const n=per+(rest-->0?1:0); return {einheit:x.titel,stunden:Array.from({length:n},(_,i)=>({titel:i===n-1&&n>2?x.titel+' – Wiederholung / Puffer':x.titel+' – Stunde '+(i+1),ziele:'',dauer:1}))}; })); };
  if($('#svKI',m)) $('#svKI',m).onclick=async ev=>{ calc(); if(!themen.some(x=>x.on)){ toast('Bitte mindestens ein Thema wählen'); return; } ev.target.disabled=true; $('#svOut',m).innerHTML='<div class="info">'+ic('spark')+' Stoffverteilung wird geplant …</div>'; try{ show(await ENV.sample.json(prompt(),{cache:false})); }catch(err){ $('#svOut',m).innerHTML=`<div class="hint">KI-Fehler: ${esc(err&&(err.message||err.code)||'unbekannt')}</div>`; } ev.target.disabled=false; };

/* ================= Automatische Synchronisation über GitHub ================= */
const GH={busy:false,timer:null,status:'',err:'',last:0};
function ghCfg(){ try{ return JSON.parse(lsGet('lo-gh','null')); }catch(e){ return null; } }
function ghOn(){ const c=ghCfg(); return MODE!=='cloud'&&!!(c&&c.repo&&c.token); }
async function ghFetch(path,opt={}){ const c=ghCfg(); const r=await fetch('https://api.github.com/repos/'+c.repo+'/contents/'+path,{cache:'no-store',...opt,headers:{'Authorization':'Bearer '+c.token,'Accept':opt.raw?'application/vnd.github.raw':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}}); return r; }
function ghErrText(r){ return r.status===401?'Token ungültig oder abgelaufen':r.status===403?'Token hat keine Schreib-/Leserechte für das Repository':r.status===404?'Repository nicht gefunden (Name prüfen, Token-Zugriff auf dieses Repository?)':'GitHub-Fehler '+r.status; }
async function ghGetJSON(path){ const r=await ghFetch(path); if(r.status===404) return {sha:null,data:null}; if(!r.ok) throw new Error(ghErrText(r)); const meta=await r.json();
  let text; if(meta.content&&meta.encoding==='base64'){ const bin=atob(meta.content.replace(/\n/g,'')); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); text=new TextDecoder().decode(u8); }
  else { const rr=await ghFetch(path,{raw:true}); if(!rr.ok) throw new Error(ghErrText(rr)); text=await rr.text(); }
  return {sha:meta.sha,data:JSON.parse(text)}; }
async function ghPut(path,blob,sha,msg){ const content=await b64(blob); const r=await ghFetch(path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg||'Lehrer-Organizer Sync',content,...(sha?{sha}:{})})}); return r; }
function ghSetStatus(s,err){ GH.status=s; GH.err=err||''; const el=document.getElementById('ghStat'); if(el) el.textContent=ghStatusText(); renderNav(); }
function ghStatusText(){ if(!ghOn()) return ''; if(GH.busy) return 'Synchronisiere …'; if(GH.err) return 'Sync-Fehler: '+GH.err; if(!GH.last) GH.last=+lsGet('lo-gh-last',0); return GH.last?'Synchronisiert '+new Date(GH.last).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'Noch nicht synchronisiert'; }
function ghSchedule(ms){ if(!ghOn()||GH.busy) return; clearTimeout(GH.timer); GH.timer=setTimeout(()=>ghSync(),ms==null?15000:ms); }
async function ghSync(opts={}){
  if(!ghOn()||GH.busy) return false; if(!navigator.onLine){ ghSetStatus('','offline – wird nachgeholt'); return false; }
  GH.busy=true; ghSetStatus('busy');
  try{
    for(let attempt=0;attempt<3;attempt++){
      const rem=await ghGetJSON('lehrer-organizer/daten.json'); let st=null;
      if(rem.data&&rem.data.app==='lehrer-organizer'){ st=await mergeImport(rem.data,{quiet:true}); await ghPullFiles(rem.data.ghFiles||[]); }
      const lastPush=+lsGet('lo-gh-push',0); const remoteFiles=new Set((rem.data&&rem.data.ghFiles)||[]);
      const up=await ghPushFiles(remoteFiles);
      if(rem.data&&!up&&changesSince(lastPush)===0&&!opts.force){ break; }
      const data=await buildExport({typ:'voll',files:false}); data.ghFiles=[...remoteFiles];
      const r=await ghPut('lehrer-organizer/daten.json',new Blob([JSON.stringify(data)],{type:'application/json'}),rem.sha,'Sync von '+deviceName());
      if(r.status===409||r.status===422){ continue; } if(!r.ok) throw new Error(ghErrText(r));
      lsSet('lo-gh-push',String(Date.now())); break; }
    GH.last=Date.now(); lsSet('lo-gh-last',String(GH.last)); lsSet('lo-lastbackup',String(GH.last)); GH.busy=false; ghSetStatus('ok');
    if(!DB) await flushLocal(); render(); return true;
  }catch(e){ GH.busy=false; ghSetStatus('err',e&&e.message||String(e)); return false; }
}
async function ghPushFiles(remoteFiles){ let n=0; const docs=Object.values(S.docs).filter(d=>d.kind==='file'&&!d._fehlt&&!remoteFiles.has(d.id));
  for(const d of docs){ try{ const b=await fileBlob(d); if(!b) continue; if(b.size>45*1024*1024) continue; ghSetStatus('busy'); const r=await ghPut('lehrer-organizer/dateien/'+d.id,b,null,'Datei '+(d.fileName||d.titel));
      if(r.ok||r.status===422){ remoteFiles.add(d.id); n++; } }catch(e){} } return n; }
async function ghPullFiles(ids){ const set=new Set(ids); let n=0;
  for(const d of Object.values(S.docs)){ if(!set.has(d.id)) continue; let need=!!d._fehlt; if(!need&&d.kind==='file'){ try{ need=!(await fileBlob(d)); }catch(e){ need=true; } } if(!need) continue;
    try{ const r=await ghFetch('lehrer-organizer/dateien/'+d.id,{raw:true}); if(!r.ok) continue; const blob=await r.blob(); const st=await storeBlob(new Blob([blob],{type:d.mime||(d._fehlt&&'')||blob.type}),d.fileName);
      const nd={...d,kind:'file'}; delete nd._fehlt; delete nd.ort; delete nd.fileId; delete nd.assetId; delete nd.url; Object.assign(nd,st); S.docs[d.id]=nd; if(DB) dbWrite('docs/'+d.id,clone(nd)); else markDirty('docs'); n++; }catch(e){} }
  return n; }

const rpCache={};
async function rpVolltext(d){ if(rpCache[d.id]!=null) return rpCache[d.id]; let txt='';
  try{ if(d.kind==='md') txt=d.md||''; else if(isPdf(d)){ const pdf=await getPdf(d); for(let i=1;i<=pdf.numPages;i++){ const tc=await (await pdf.getPage(i)).getTextContent(); txt+=tc.items.map(it=>it.str).join(' ')+'\n'; } } }catch(e){}
  return rpCache[d.id]=txt.replace(/[ \t]+/g,' '); }
async function rpAuszug(k,thema){ const docs=Object.values(S.docs).filter(d=>d.fachId===k.fachId&&/rahmenplan|(^|[\s_-])rp([\s_-]|$)/i.test((d.titel||'')+' '+(d.fileName||'')));
  for(const d of docs){ const t=await rpVolltext(d); if(!t) continue; const nt=norm(t), key=norm(thema).slice(0,40); if(!key) continue;
    const stufeIdx=[...nt.matchAll(new RegExp('(jahrgangsstufe|klassenstufe|klasse)\\s*'+k.stufe+'\\b','g'))].map(m=>m.index);
    let best=-1; for(let i=nt.indexOf(key);i>=0;i=nt.indexOf(key,i+1)){ if(best<0) best=i; if(stufeIdx.some(s=>s<i&&i-s<60000)){ best=i; } }
    if(best>=0) return {quelle:d.titel,text:t.slice(Math.max(0,best-200),best+4500)}; }
  return null; }

const PHASEN=['Begrüßung','Einstieg','Motivation','Problemstellung','Wiederholung','Hinführung','Erarbeitung','Experiment','Versuch','Auswertung','Übung','Anwendung','Vertiefung','Festigung','Sicherung','Kontrolle','Reflexion','Abschluss','Ausblick','Hausaufgabe'];
function ablaufPhasen(txt){
  const out=[]; const lines=String(txt||'').split(/\n/).map(l=>l.replace(/\*\*/g,'').trim()).filter(Boolean);
  for(const raw of lines){ const l=raw.replace(/^[-–•*\d.)\s]+(?=\S)/,'').trim(); if(!l) continue;
    const mm=l.match(/(\d{1,3})\s*(?:–|-|bis)?\s*(\d{1,3})?\s*(?:min\.?|minuten|')/i); let min=mm?+(mm[2]&&+mm[2]>+mm[1]?+mm[2]-+mm[1]:mm[1]):0;

    const isNew=!!ph||!!mm||/^[-–•*\d]/.test(raw)===true&&!out.length;
    let rest=l.replace(/\(?\s*\d{1,3}\s*(?:–|-|bis)?\s*\d{0,3}\s*(?:min\.?|minuten|')\s*\)?/ig,'').trim();
    let name=ph||''; const sm=rest.match(/\s*(?::|–|—)\s*/); if(sm&&sm.index>0&&sm.index<40){ const head=rest.slice(0,sm.index).trim(); if(!name) name=head; rest=rest.slice(sm.index+sm[0].length).trim(); } else if(ph){ rest=rest.replace(new RegExp('^'+ph+'\\w*\\s*','i'),'').trim(); }
    if(isNew||!out.length) out.push({phase:name||'Phase '+(out.length+1),minuten:min,text:rest?[rest]:[],roh:[raw]});
    else { const p=out[out.length-1]; if(rest) p.text.push(rest); p.roh.push(raw); if(!p.minuten&&min) p.minuten=min; }
  }
  return out; }

async function buildExport(opts){
  const data={app:'lehrer-organizer',v:3,typ:opts.typ||'voll',exported:new Date().toISOString(),geraet:deviceName()};
  let docs;
  if(data.typ==='fach'){ const ids=opts.fachIds||[]; data.faecher=faecher().filter(f=>ids.includes(f.id)); data.ordner={}; data.docs={};
    Object.values(S.ordner).filter(o=>ids.includes(o.fachId)).forEach(o=>data.ordner[o.id]=o); Object.values(S.docs).filter(d=>ids.includes(d.fachId)).forEach(d=>data.docs[d.id]=d); docs=Object.values(data.docs); }

  if(opts.files){ data.files={}; let i=0; const fd=docs.filter(d=>d.kind==='file');
    for(const d of fd){ i++; if(fd.length>5) progress('Dateien werden eingepackt … '+i+'/'+fd.length); try{ const b=await fileBlob(d); if(b) data.files[d.id]={type:b.type||d.mime||'',data:await b64(b)}; }catch(e){} } progress(''); }

function progress(t){ let el=document.getElementById('progbar'); if(!t){ if(el) el.remove(); return; } if(!el){ el=document.createElement('div'); el.id='progbar'; el.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9999;background:#1e2430;color:#fff;padding:9px 16px;border-radius:12px;font-size:14px'; document.body.appendChild(el); } el.textContent=t; }

async function readJSONFile(file){ try{ const o=JSON.parse(await file.text()); return o&&o.app==='lehrer-organizer'?o:null; }catch(e){ return null; } }
async function importDoc(it,o,cur){
  if(it._fehlt&&cur&&cur.kind==='file'&&!cur._fehlt){ const r={...it,kind:'file'}; delete r._fehlt; delete r.ort; ['fileId','assetId','url'].forEach(k=>{ delete r[k]; if(cur[k]!=null) r[k]=cur[k]; }); if(cur.ort!=null) r.ort=cur.ort; return r; }
  if(it._fehlt&&o.files&&o.files[it.id]){ it={...it,kind:'file'}; delete it.ort; }
  if(it.kind!=='file') return it;
  if(o.files&&o.files[it.id]){ try{ const bin=atob(o.files[it.id].data); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); delete it.fileId; delete it.assetId; delete it.url; delete it._fehlt; Object.assign(it,await storeBlob(new Blob([u8],{type:o.files[it.id].type}),it.fileName)); return it; }catch(e){} }

  if(cur&&cur._fehlt) return {...cur,...it,kind:'extern',_fehlt:cur._fehlt,ort:cur.ort};

  return {...it,_fehlt:{kind:'file',fileId:it.fileId,assetId:it.assetId,url:it.url},kind:'extern',ort:'Datei liegt auf „'+(o.geraet||'anderem Gerät')+'“ – beim Abgleich „mit Dateien“ wählen'};

function mergeProfil(a,b){ const fa=(a&&a.faecher)||[], fb=(b&&b.faecher)||[]; const out=fa.map(f=>({...f,stufen:[...(f.stufen||[])]}));

async function mergeImport(o){

  if(o.typ==='fach'){ const pf=P_(); S.settings.profil=mergeProfil(pf,{faecher:o.faecher||[]}); }

      let it=clone(it0); if(c==='ordner'&&omap[it.id]) continue; if(c==='docs'&&omap[it.ordnerId]) it.ordnerId=omap[it.ordnerId];
      const k=c+'/'+it.id, t=it._t||0; const cur=S[c][it.id];

  if(!DB) await flushLocal(); render(); return st;
}
async function replaceImport(o){
  progress('Ersetze Daten …');
  for(const c of COLLS){ for(const id of Object.keys(S[c])){ if(!(o[c]||{})[id]){ delete S[c][id]; if(DB) dbWrite(c+'/'+id,null); } } if(!DB) markDirty(c); }
  if(o.settings){ S.settings={...clone(DEFAULT_SETTINGS),...clone(o.settings)}; }
  for(const c of COLLS){ for(const it0 of Object.values(o[c]||{})){ const it=clone(it0); const val=c==='docs'?await importDoc(it,o,null):it; S[c][it.id]=val; if(DB) dbWrite(c+'/'+it.id,clone(val)); } if(!DB) markDirty(c); }
  if(o.druck){ S.druck=o.druck; if(DB) dbWrite('meta/druck',{marks:clone(S.druck)}); else markDirty('druck'); }

function spFachName(raw){ const r=String(raw||'').trim(); if(!r) return ''; const n=norm(r).replace(/[^a-z0-9 ]/g,'').trim();
  const all=[...faecher().map(f=>f.name),...FACH_VORLAGEN.map(v=>v.name)];
  const ex=all.find(x=>norm(x)===n); if(ex) return ex;
  if(FACH_ABK[n.replace(/ /g,'')]) return FACH_ABK[n.replace(/ /g,'')];
  const pre=all.find(x=>norm(x).startsWith(n)&&n.length>=3); return pre||r; }
function spPrompt(){
  const fs=[...new Set([...faecher().filter(f=>(f.stufen||[]).length).map(f=>f.name),...FACH_VORLAGEN.map(v=>v.name)])];
  return `Du liest das Foto eines Stundenplans einer Schule in Mecklenburg-Vorpommern aus (Lehrer- oder Klassenstundenplan, Montag–Freitag).
Gib NUR JSON zurück, ohne Erklärung, in genau diesem Format:
{"art":"lehrer"|"klasse","klasse":"<nur bei Klassenstundenplan: Klassenname>","zeiten":[["07:45","08:30"],...],"eintraege":[{"tag":1,"std":1,"fach":"Physik","fach_roh":"Ph","klasse":"7Ra","raum":"112"}],"hinweis":"<Besonderheiten, z. B. A/B-Wochen, unleserliche Felder>"}

- Leere Felder, Pausen, Aufsichten und Sprechzeiten weglassen. Erfinde nichts; Unleserliches in "hinweis" nennen.`; }
async function spPrepImage(file){
  const url=URL.createObjectURL(file);
  try{ const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const max=2000, sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',0.86));
  } catch(e){ return file; } finally{ setTimeout(()=>URL.revokeObjectURL(url),1000); }
}
function spParse(raw){ if(raw&&typeof raw==='object') return raw; const s=String(raw||''); const m=s.match(/\{[\s\S]*\}/); return JSON.parse(m?m[0]:s); }

function spReview(d){
  const ein=(d&&Array.isArray(d.eintraege)?d.eintraege:[]).map(e=>({tag:+e.tag,std:+e.std,fach:spFachName(e.fach||e.fach_roh),roh:e.fach_roh||e.fach||'',klasse:String(e.klasse||d.klasse||'').replace(/\s+/g,'').trim()})).filter(e=>e.tag>=1&&e.tag<=5&&e.std>=1&&e.std<=12&&e.fach);
  if(!ein.length){ toast('Im Foto wurden keine Unterrichtsstunden erkannt'); return; }
  const groups={}; ein.forEach(e=>{ const key=norm(e.fach)+'|'+norm(e.klasse); const g=groups[key]||(groups[key]={fach:e.fach,roh:e.roh,klasse:e.klasse,slots:[]}); if(!g.slots.some(s=>s.tag===e.tag&&s.std===e.std)) g.slots.push({tag:e.tag,std:e.std}); });
  const G=Object.values(groups).sort((a,b)=>a.klasse.localeCompare(b.klasse,'de',{numeric:true})||a.fach.localeCompare(b.fach,'de'));
  const klByName=n=>Object.values(S.klassen).find(k=>norm(k.name).replace(/\s/g,'')===norm(n).replace(/\s/g,''));
  G.forEach(g=>{ g.slots.sort((a,b)=>a.tag-b.tag||a.std-b.std); const fid=fachIdByName(g.fach); const v=FACH_VORLAGEN.find(x=>norm(x.name)===norm(g.fach));
    g.fachId=fid; g.neuFach=!fid&&!!v; g.stufe=parseInt(g.klasse)||'';
    const kl=klByName(g.klasse); g.klasseId=kl?kl.id:''; const ku=kl&&fid?Object.values(S.kurse).find(k=>!k.archiv&&k.klasseId===kl.id&&k.fachId===fid):null; g.kursId=ku?ku.id:'';
    g.on=!!g.klasse&&(!!fid); });
  const zeiten=Array.isArray(d.zeiten)?d.zeiten.filter(z=>Array.isArray(z)&&/^\d{1,2}:\d{2}$/.test(z[0]||'')&&/^\d{1,2}:\d{2}$/.test(z[1]||'')).map(z=>z.map(t=>t.padStart(5,'0'))):[];
  const fOpts=g=>{ const list=faecher().filter(f=>(f.stufen||[]).length).map(f=>[f.id,f.name]); if(g.neuFach) list.unshift(['+'+g.fach,'+ '+g.fach+' (Fach neu anlegen)']); return list; };
  const slotTxt=sl=>sl.map(s=>TAGE[s.tag]+' '+s.std+'.').join(', ');
  const row=(g,i)=>{ const known=g.fachId||g.neuFach; return `<div class="card" style="padding:10px 12px;margin:0 0 8px;${g.on?'':'opacity:.6'}">
    <label class="row nw" style="cursor:pointer"><input type="checkbox" data-gi="${i}" ${g.on?'checked':''} ${known&&g.klasse?'':'disabled'} style="width:22px;height:22px"><b>${esc(g.fach)}${g.klasse?' '+esc(g.klasse):''}</b><span class="tiny muted">${g.roh&&norm(g.roh)!==norm(g.fach)?'(„'+esc(g.roh)+'“) ':''}${g.slots.length} Std./Woche</span></label>
    <div class="small" style="margin:4px 0 6px 30px">${esc(slotTxt(g.slots))}</div>
    ${known&&g.klasse?`<div class="fields" style="margin-left:30px">
      <div><label class="f">Fach</label><select data-gf="${i}">${opt(fOpts(g),g.fachId||('+'+g.fach))}</select></div>
      <div><label class="f">Klasse</label><input type="text" data-gk="${i}" value="${esc(g.klasse)}"></div>
      <div class="full tiny muted">${g.kursId?'Kurs „'+esc(S.kurse[g.kursId].titel)+'“ wird aktualisiert – bisherige Zeiten werden ersetzt.':'Neuer Kurs'+(g.klasseId?'':' und neue Klasse '+esc(g.klasse))+(g.neuFach?', Fach '+esc(g.fach)+' wird im Profil ergänzt':'')+'.'}</div></div>`
    :`<div class="tiny muted" style="margin-left:30px">${g.klasse?'„'+esc(g.fach)+'“ ist kein Fach deines Profils und wird übersprungen.':'Keine Klasse erkannt – wird übersprungen.'}</div>`}</div>`; };
  const m=openModal('Stundenplan prüfen',`<div class="stack">

    ${zeiten.length?`<label class="row nw card" style="padding:10px 12px;margin:0;cursor:pointer"><input type="checkbox" id="spZ" style="width:22px;height:22px"> Stundenzeiten übernehmen: <span class="small muted">${esc(zeiten.map((z,i)=>(i+1)+'. '+z[0]).join(' · '))}</span></label>`:''}

    sel.forEach(g=>{ const f=fs.find(x=>x.id===g.fachId); if(!f) return; const st=parseInt(g.klasse)||'';

      if(ku){ save('kurse',{...ku,slots:g.slots.map(s=>({...s}))},true); nUpd++; }

    S.settings.profil=makeProfil(P_().name||'',P_().schule||'',fs);
    if($('#spZ',m)&&$('#spZ',m).checked){ S.settings.periods=zeiten.map(z=>[z[0],z[1]]); }

    createLehrplanOrdner(); saveSettings(); closeModal(); render();
    toast([nNeu?nNeu+' Kurse angelegt':'',nUpd?nUpd+' Kurse aktualisiert':'',nK?nK+' Klassen neu':'',nF?nF+' Fächer ergänzt':''].filter(Boolean).join(', ')||'Gespeichert');

function gapCtx(g){ const k=S.kurse[g.ki.kid]; if(!k) return null; const typ={stunde:'Arbeitsblatt',praes:'Präsentation',lk:'Leistungskontrolle'}[g.ki.kind]||'KI-Entwurf';

  if(g.ki.eid){ const e=(k.einheiten||[]).find(e=>e.id===g.ki.eid); return {typ,fachId:k.fachId,stufe:k.stufe,ordnerId:e?ensureOrdner(k.fachId,k.stufe,e.titel):''}; }
  return {typ,fachId:k.fachId,stufe:k.stufe}; }
function unitDialog(kid,ei){

  }
